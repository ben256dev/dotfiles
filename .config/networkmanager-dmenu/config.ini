# networkmanager-dmenu settings, used by ~/.local/bin/wifi. All options:
# https://github.com/firecat53/networkmanager-dmenu/blob/main/config.ini.example
[dmenu]
# rofi itself (not ~/.local/bin/launcher): networkmanager-dmenu picks its rofi
# flags by the command's name. The wifi script adds the theme.
dmenu_command = rofi -i
active_chars = *
highlight = True
compact = False
list_saved = False
prompt = Wi-Fi

[dmenu_passphrase]
obscure = True

[editor]
# For networks the menu can't set up itself (eduroam and other 802.1X logins).
terminal = ghostty
gui_if_available = False

[nmdm]
rescan_delay = 5
