set -g default-terminal "tmux-256color"
# Do not pass a stale NO_COLOR setting to new panes.
set-environment -gu NO_COLOR
set -ga terminal-overrides ",xterm-256color:Tc,tmux-256color:Tc,xterm-ghostty:RGB"
set -as terminal-features ",xterm*:extkeys"
set -s extended-keys on
set -g update-environment "COLORTERM TERM LANG LC_* DISPLAY WAYLAND_DISPLAY XAUTHORITY XDG_RUNTIME_DIR"
set -g allow-rename off

# Closing a terminal window ends its session, like closing any other window.
# (Each Ghostty window starts its own session; detaching would end it too.)
set -g destroy-unattached on

set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

set -g mouse on

set -g mode-keys vi
set -g set-clipboard on

set -g prefix C-s

unbind r
bind r source-file ~/.tmux.conf \; display "source-file ~/.tmux.conf"

bind-key m select-pane -L
bind-key n select-pane -D
bind-key e select-pane -U
bind-key i select-pane -R

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle

unbind -T copy-mode-vi Space
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "sh ~/.tmux/copy.sh"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "sh ~/.tmux/copy.sh"

bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

bind -T copy-mode-vi / command-prompt -i -p "/" "send -X search-forward-incremental \"%%%\""
bind -T copy-mode-vi ? command-prompt -i -p "?" "send -X search-backward-incremental \"%%%\""
bind -T copy-mode-vi n send -X search-again
bind -T copy-mode-vi N send -X search-reverse

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

set-option -g status-position top

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'odedlaz/tmux-onedark-theme'

set -g @onedark_widgets "#(~/.tmux/battery.sh)"

# Quiet status bar for terminals without focus (see .tmux/focus.sh).
# Output and failures stay hidden: tmux would show them over the terminal.
set-hook -g client-focus-out 'run -b "sh ~/.tmux/focus.sh out #{q:session_name} >/dev/null 2>&1 || true"'
set-hook -g client-focus-in  'run -b "sh ~/.tmux/focus.sh in #{q:session_name} >/dev/null 2>&1 || true"'

# Fetch TPM on first start so a fresh machine gets the theme without manual steps.
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone -q https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm'"

# Initialize TMUX plugin manager (keep this near the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# install_plugins needs the path tpm just set; reload tpm afterwards to apply them.
if "test ! -d ~/.tmux/plugins/tmux-onedark-theme" \
   "run '~/.tmux/plugins/tpm/bin/install_plugins >/dev/null && ~/.tmux/plugins/tpm/tpm'"

# Bring every terminal's status bar up to date with its focus. After tpm, so
# it sees the theme's colours.
run 'sh ~/.tmux/focus.sh sync >/dev/null 2>&1 || true'
