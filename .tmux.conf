set -g default-terminal "tmux-256color"
# Do not pass a stale NO_COLOR setting to new panes.
set-environment -gu NO_COLOR
set -ga terminal-overrides ",xterm-256color:Tc,tmux-256color:Tc,xterm-ghostty:RGB"
set -as terminal-features ",xterm*:extkeys"
set -s extended-keys on
set -g update-environment "COLORTERM TERM LANG LC_* DISPLAY WAYLAND_DISPLAY XAUTHORITY XDG_RUNTIME_DIR"
set -g allow-rename off

# Closing a terminal window ends its session, like closing any other window.
# (Each Ghostty window starts its own session; detaching would end it too.)
set -g destroy-unattached on

set -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1

set -g mouse on

set -g mode-keys vi
set -g set-clipboard on

set -g prefix C-s

unbind r
bind r source-file ~/.tmux.conf \; display "source-file ~/.tmux.conf"

bind-key m select-pane -L
bind-key n select-pane -D
bind-key e select-pane -U
bind-key i select-pane -R

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle

unbind -T copy-mode-vi Space
# Vim's operators, motions and text objects, run by Neovim (.tmux/vim.sh):
# with no selection, y t : or y i { copies; i ' or v a p selects. y with a
# selection copies it.
run 'bash ~/.tmux/vim.sh bind'

# Copy mode's top right: the keys of a Vim command waiting for more (y t),
# and the position only when scrolled up (lines up / lines of history) or
# searching, not a [0/0] at the bottom.
set -g copy-mode-position-format "#[align=right]#{?@vim_keys,#{s/<lt>/</:#{s/<Space>/␣/:@vim_keys}}  ,}#{?#{e|>:#{copy_position},0},#{copy_position}/#{copy_position_limit},}#{?search_timed_out, (timed out),#{?search_count, (#{search_count}#{?search_count_partial,+,} results),}}"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "sh ~/.tmux/copy.sh"

bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi H send -X start-of-line
bind -T copy-mode-vi L send -X end-of-line

bind -T copy-mode-vi / command-prompt -i -p "/" "send -X search-forward-incremental \"%%%\""
bind -T copy-mode-vi ? command-prompt -i -p "?" "send -X search-backward-incremental \"%%%\""
bind -T copy-mode-vi n send -X search-again
bind -T copy-mode-vi N send -X search-reverse

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# The same without the prefix, on Alt. With kmonad, Alt is holding R or I
# (home-row mods); the physical Alt keys are the number layer. These take the
# keys from programs inside tmux too (bash's Alt+C capitalizes a word, for
# example), but nothing here relies on them.
bind -n -N "New tab" M-c new-window -c "#{pane_current_path}"
bind -n -N "Rename tab" M-r command-prompt -I "#W" { rename-window "%%" }
bind -n -N "Horizontal split" M-h split-window -v -c "#{pane_current_path}"
bind -n -N "Vertical split" M-v split-window -h -c "#{pane_current_path}"
bind -n -N "Pane to the left" M-m select-pane -L
bind -n -N "Pane below" M-n select-pane -D
bind -n -N "Pane above" M-e select-pane -U
bind -n -N "Pane to the right" M-i select-pane -R
bind -n -N "Toggle pane zoom" M-z resize-pane -Z
bind -n -N "Copy mode" M-y copy-mode
bind -n -N "Close pane" M-x kill-pane
bind -n -N "Go to tab 1" M-1 select-window -t :=1
bind -n -N "Go to tab 2" M-2 select-window -t :=2
bind -n -N "Go to tab 3" M-3 select-window -t :=3
bind -n -N "Go to tab 4" M-4 select-window -t :=4
bind -n -N "Go to tab 5" M-5 select-window -t :=5
bind -n -N "Go to tab 6" M-6 select-window -t :=6
bind -n -N "Go to tab 7" M-7 select-window -t :=7
bind -n -N "Go to tab 8" M-8 select-window -t :=8
bind -n -N "Go to tab 9" M-9 select-window -t :=9
# Alt+? lists these (their -N notes) in a popup, sized to fit; any key closes
# it (.tmux/cheatsheet.sh). The focused status bar says so on its right
# (.tmux/focus.sh adds it), like the hint in Neovim's status line.
set -g @cheatsheet_hint "󰌌 Alt + ?"
bind -n -N "This help" M-? run -b "sh ~/.tmux/cheatsheet.sh '#{client_name}'"
# Ghostty sends Alt+? as an extended key that keeps the Shift (\033[27;4;63~),
# which tmux names M-S-?, not M-?; bind that too (without a note, so the
# cheatsheet lists Alt+? once).
bind -n M-S-? run -b "sh ~/.tmux/cheatsheet.sh '#{client_name}'"

set-option -g status-position top

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'odedlaz/tmux-onedark-theme'

set -g @onedark_widgets "#(~/.tmux/battery.sh)"

# Quiet status bar for terminals without focus (see .tmux/focus.sh). bspwm
# reports focus changes; tmux's own focus events (which come late, through
# Ghostty) are only a backup. Window titles tell the windows' sessions apart.
set -g set-titles on
set -g set-titles-string 'tmux #{session_id}'
set -g focus-events on
set-hook -g client-focus-out 'run -b "sh ~/.tmux/focus.sh sync"'
set-hook -g client-focus-in  'run -b "sh ~/.tmux/focus.sh sync"'
set-hook -g client-attached  'run -b "sh ~/.tmux/focus.sh sync"'

# Fetch TPM on first start so a fresh machine gets the theme without manual steps.
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone -q https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm'"

# Initialize TMUX plugin manager (keep this near the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# install_plugins needs the path tpm just set; reload tpm afterwards to apply them.
if "test ! -d ~/.tmux/plugins/tmux-onedark-theme" \
   "run '~/.tmux/plugins/tpm/bin/install_plugins >/dev/null && ~/.tmux/plugins/tpm/tpm'"

# The theme greys out inactive panes through window-style, but that only
# recolours default-coloured text: anything a program colours itself stays
# bright, so a split looked half dimmed. tmux can't dim a whole pane, so
# don't dim at all. After tpm, so a reload doesn't bring the theme's back.
set -g window-style default
set -g window-active-style default

# Give the theme's status bar its quiet unfocused version. After tpm, so it
# sees the theme's colours.
run 'sh ~/.tmux/focus.sh'
